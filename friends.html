<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our People — FPS Class of 2026</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display:ital@0;1&family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--ink:#302843;--serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',sans-serif;--hand:'Kalam',cursive}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--sans);background:radial-gradient(circle at 12% 8%,#ffd8e9,transparent 28%),radial-gradient(circle at 90% 18%,#c9f3f2,transparent 30%),linear-gradient(135deg,#f8efff,#fff5df);min-height:100vh}.top{padding:25px 6vw;display:flex;justify-content:space-between;align-items:center}.back{color:white;background:#403453;padding:12px 18px;border-radius:30px;font-size:12px;font-weight:700;text-decoration:none;box-shadow:0 5px 0 #c5b6df}.brand{font:17px var(--hand)}header{text-align:center;padding:45px 20px 55px}header small{font:16px var(--hand);color:#9d6d9b}h1{font:clamp(3.5rem,9vw,7rem)/.9 var(--serif);letter-spacing:-.05em;margin:18px 0}h1 em{color:#a477c7}header p{color:#766d83;max-width:520px;margin:20px auto;line-height:1.7}.section-title{font:clamp(2.4rem,5vw,3.6rem)/1 var(--serif);text-align:center;margin:0 0 28px;letter-spacing:-.03em}.section-title em{color:#a477c7}.friends-section{padding:0 0 28px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding:0 6vw 90px;max-width:1500px;margin:auto}.friend{min-height:0;perspective:1100px;cursor:pointer}.inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}.friend:hover .inner{transform:rotateY(9deg) rotateX(-5deg) translateY(-9px)}.frame{position:relative;height:100%;border-radius:24px;padding:12px 12px 18px;background:#fff;box-shadow:0 18px 35px #5d47752c;transform-style:preserve-3d}.photo{width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#f4eef6}.photo img{width:100%;height:100%;object-fit:cover;object-position:center 12%;transition:transform .5s}.friend:hover img{transform:scale(1.07)}.missing-photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(145deg,#f9d9e9,#e6dcff,#d8f1ef);color:#80658f}.missing-photo span{font-size:clamp(3rem,7vw,5rem)}.missing-photo small{font:700 10px var(--sans);letter-spacing:.13em}.name{font:27px var(--serif);margin:14px 5px 0}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:0 4vw 60px}.name{font-size:22px}.top{padding:18px 4vw}}@media(max-width:390px){.frame{padding:9px}.name{font-size:19px}}
</style></head><body><div class="top"><a class="back" href="index.html">← Back to our farewell</a><span class="brand">FPS ✿ CLASS OF 2026</span></div><header><small>✿ THE PEOPLE WHO MADE IT SPECIAL ✿</small><h1>Meet our <em>people.</em></h1><p>The faces behind our favourite memories.</p></header><main><!-- boys section moved below girls --><section class="friends-section"><h2 class="section-title">Meet our <em>girls.</em></h2><div class="grid" id="girls"></div></section><section class="friends-section"><h2 class="section-title">Meet our <em>boys.</em></h2><div class="grid" id="boys"></div></section></main><script>
const boys=[
{name:"Huzaif",photo:"photos/friends/boy-01.webp"},
{name:"Tauqeer",photo:"photos/friends/boy-02.webp"},
{name:"Hashim",photo:"photos/friends/boy-03.webp"}
];
const girls=[
{name:"Falak",photo:"photos/friends/friend-01.webp"},
{name:"Mursaleen",photo:"photos/friends/friend-02.webp"},
{name:"Khansa",photo:"photos/friends/friend-03.webp"},
{name:"Fatima",photo:"photos/friends/friend-04.webp"},
{name:"Ronak",photo:null,line:"Sorry, we don’t have your photos because you’re never present anywhere!"},
{name:"Muskan",photo:null,line:"Sorry, we don’t have your photos because you’re never present anywhere!"}
];
function renderCards(people,targetId){
 const grid=document.getElementById(targetId);
 people.forEach(p=>{
  const c=document.createElement('article');c.className='friend';
  c.innerHTML='<div class="inner"><div class="frame"><div class="photo"></div><div class="name"></div></div></div>';
  const photo=c.querySelector('.photo');
  if(p.photo){const img=document.createElement("img");img.src=p.photo;img.alt=p.name;img.loading="lazy";img.onerror=()=>img.style.opacity=".08";photo.append(img);}
  else{photo.classList.add("missing-photo");photo.innerHTML='<span>🫥</span><small>'+p.line+'</small>';}
  c.querySelector('.name').textContent=p.name||p.line;
  c.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.querySelector('.inner').style.transform='rotateY('+(x*18)+'deg) rotateX('+(-y*14)+'deg) translateY(-8px)'});
  c.addEventListener('pointerleave',()=>c.querySelector('.inner').style.transform='');
  grid.append(c);
 });
}
renderCards(boys,'boys');renderCards(girls,'girls');
</script></body></html>
