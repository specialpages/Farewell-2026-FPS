<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our People — FPS Class of 2026</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display:ital@0;1&family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--ink:#302843;--serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',sans-serif;--hand:'Kalam',cursive}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--sans);background:radial-gradient(circle at 12% 8%,#ffd8e9,transparent 28%),radial-gradient(circle at 90% 18%,#c9f3f2,transparent 30%),linear-gradient(135deg,#f8efff,#fff5df);min-height:100vh}.top{padding:25px 6vw;display:flex;justify-content:space-between;align-items:center}.back{color:white;background:#403453;padding:12px 18px;border-radius:30px;font-size:12px;font-weight:700;text-decoration:none;box-shadow:0 5px 0 #c5b6df}.brand{font:17px var(--hand)}header{text-align:center;padding:45px 20px 55px}header small{font:16px var(--hand);color:#9d6d9b}h1{font:clamp(3.5rem,9vw,7rem)/.9 var(--serif);letter-spacing:-.05em;margin:18px 0}h1 em{color:#a477c7}header p{color:#766d83;max-width:520px;margin:20px auto;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding:0 6vw 90px;max-width:1500px;margin:auto}.friend{height:370px;perspective:1100px;cursor:pointer}.inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}.friend:hover .inner{transform:rotateY(9deg) rotateX(-5deg) translateY(-9px)}.frame{position:absolute;inset:0;border-radius:24px;padding:12px 12px 18px;background:#fff;box-shadow:0 18px 35px #5d47752c;transform-style:preserve-3d}.photo{height:275px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#ffd4e5,#d8d1ff,#b9edf0)}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.friend:hover img{transform:scale(1.07)}.name{font:27px var(--serif);margin:14px 5px 0}.role{font:14px var(--hand);color:#9b789c;margin:2px 5px}.badge{position:absolute;right:24px;top:22px;border-radius:30px;background:#fff9;padding:7px 10px;font-size:10px;font-weight:700;z-index:2}.foot{text-align:center;padding:0 20px 40px;font:15px var(--hand);color:#8e789e}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:0 4vw 60px}.friend{height:300px}.photo{height:210px}.name{font-size:22px}.top{padding:18px 4vw}}@media(max-width:390px){.friend{height:270px}.photo{height:185px}.frame{padding:9px}.name{font-size:19px}}
</style></head><body><div class="top"><a class="back" href="index.html">← Back to our farewell</a><span class="brand">FPS ✿ CLASS OF 2026</span></div><header><small>✿ THE PEOPLE WHO MADE IT SPECIAL ✿</small><h1>Meet our <em>people.</em></h1><p>Every face holds a thousand stories. Tap a photo, tilt your phone, and take one more look at the friends who made these years unforgettable.</p></header><main class="grid" id="friends"></main><div class="foot">Different paths, one beautiful chapter. ♡</div><script>
const classmates=[
{name:"Classmate 01",role:"The class comedian",photo:"photos/friends/friend-01.jpg"},
{name:"Classmate 02",role:"The quiet legend",photo:"photos/friends/friend-02.jpg"},
{name:"Classmate 03",role:"The sports star",photo:"photos/friends/friend-03.jpg"},
{name:"Classmate 04",role:"The big dreamer",photo:"photos/friends/friend-04.jpg"},
{name:"Classmate 05",role:"The last bencher",photo:"photos/friends/friend-05.jpg"},
{name:"Classmate 06",role:"The artist",photo:"photos/friends/friend-06.jpg"},
{name:"Classmate 07",role:"The helpful one",photo:"photos/friends/friend-07.jpg"},
{name:"Classmate 08",role:"The storyteller",photo:"photos/friends/friend-08.jpg"},
{name:"Classmate 09",role:"The music lover",photo:"photos/friends/friend-09.jpg"},
{name:"Classmate 10",role:"The photographer",photo:"photos/friends/friend-10.jpg"},
{name:"Classmate 11",role:"The motivator",photo:"photos/friends/friend-11.jpg"},
{name:"Classmate 12",role:"The one and only",photo:"photos/friends/friend-12.jpg"}];
const grid=document.getElementById('friends');classmates.forEach((p,i)=>{const c=document.createElement('article');c.className='friend';c.innerHTML='<div class="inner"><div class="frame"><span class="badge">FRIEND '+String(i+1).padStart(2,'0')+'</span><div class="photo"><img src="'+p.photo+'" alt="'+p.name+'" loading="lazy"></div><div class="name"></div><div class="role"></div></div></div>';c.querySelector('.name').textContent=p.name;c.querySelector('.role').textContent=p.role;const img=c.querySelector('img');img.onerror=()=>img.style.opacity='.08';c.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.querySelector('.inner').style.transform='rotateY('+(x*18)+'deg) rotateX('+(-y*14)+'deg) translateY(-8px)'});c.addEventListener('pointerleave',()=>c.querySelector('.inner').style.transform='');grid.append(c)});
</script></body></html>
